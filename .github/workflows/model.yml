name: Lokaal taalmodel ophalen

# Haalt de gewichten van Qwen2.5-0.5B-Instruct (4-bit, MLC-formaat, Apache 2.0)
# op bij Hugging Face en zet ze in deze repo onder app/model/qwen05/resolve/main/.
# Daarna serveert GitHub Pages het model vanaf het eigen adres; de app hoeft
# dan nooit verbinding te maken met een andere partij.

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/model.yml

permissions:
  contents: write

jobs:
  ophalen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Model downloaden
        env:
          REPO_ID: mlc-ai/Qwen2.5-0.5B-Instruct-q4f16_1-MLC
          DOEL: app/model/qwen05/resolve/main
        run: |
          set -euo pipefail
          mkdir -p "$DOEL"
          SHA=$(curl -sfL "https://huggingface.co/api/models/$REPO_ID" | python3 -c 'import json,sys;print(json.load(sys.stdin)["sha"])')
          echo "Versie: $SHA"
          curl -sfL "https://huggingface.co/api/models/$REPO_ID/tree/$SHA" \
            | python3 -c 'import json,sys;[print(f["path"]) for f in json.load(sys.stdin) if f["type"]=="file" and f["path"] not in (".gitattributes","README.md")]' > /tmp/bestanden.txt
          while read -r f; do
            echo "-> $f"
            curl -sfL -o "$DOEL/$f" "https://huggingface.co/$REPO_ID/resolve/$SHA/$f"
          done < /tmp/bestanden.txt
          ( cd "$DOEL" && sha256sum * > ../SHA256SUMS.txt )
          printf 'Bron: https://huggingface.co/%s\nVersie: %s\nLicentie: Apache 2.0 (Qwen2.5-0.5B-Instruct)\nOpgehaald: %s\n' "$REPO_ID" "$SHA" "$(date -u +%F)" > app/model/qwen05/BRON.txt
          du -sh "$DOEL"
      - name: In de repo zetten
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add app/model
          git diff --cached --quiet && echo "Geen wijzigingen" || git commit -m "Lokaal taalmodel Qwen2.5-0.5B toegevoegd (via workflow)"
          git push
